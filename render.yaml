services:
  - type: web
    name: yrm-coach-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: yrm_coach
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: YRM Coach
      - key: FRONTEND_URL
        value: https://yrm-coach-frontend.onrender.com
      - key: EMERGENT_EMAIL_KEY
        sync: false
      - key: EMAIL_FROM_NAME
        value: YRM Coach Portal
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: WEBHOOK_CRON_SECRET
        generateValue: true

  - type: web
    name: yrm-coach-frontend
    runtime: static
    rootDir: frontend
    buildCommand: yarn install && yarn build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: https://yrm-coach-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
