services:
  - type: web
    name: yrm-coach-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: yrm_coach
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: YRM Coach
      - key: FRONTEND_URL
        sync: false
      - key: EMERGENT_EMAIL_KEY
        sync: false
      - key: EMAIL_FROM_NAME
        value: YRM Coach Portal
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: WEBHOOK_CRON_SECRET
        sync: false
